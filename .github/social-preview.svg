<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="cyan-glow" cx="0" cy="0" r="1" gradientTransform="translate(242 142) rotate(36) scale(570 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-glow" cx="0" cy="0" r="1" gradientTransform="translate(1038 180) rotate(142) scale(530 330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="470" y1="190" x2="990" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.48" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#DDD6FE"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity="0.045"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#020617" flood-opacity="0.58"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#0B1220"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#cyan-glow)"/>
  <rect width="1280" height="640" fill="url(#violet-glow)"/>

  <g filter="url(#shadow)">
