    <image href="../landing/assets/app-icon.svg" x="120" y="174" width="272" height="272"/>
  </g>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="474" y="241" fill="url(#title)" font-size="88" font-weight="760" letter-spacing="-3">QuotaBar</text>
    <text x="478" y="304" fill="#CBD5E1" font-size="31" font-weight="560">AI quota and local cost</text>
    <text x="478" y="346" fill="#94A3B8" font-size="31" font-weight="500">right in your menu bar.</text>

    <g font-size="18" font-weight="650" fill="#E2E8F0">
      <g transform="translate(478 391)">
        <rect width="112" height="42" rx="21" fill="#1E293B" stroke="#D97757" stroke-opacity="0.55"/>
        <circle cx="21" cy="21" r="5" fill="#D97757"/>
        <text x="36" y="27">Claude</text>
      </g>
      <g transform="translate(604 391)">
        <rect width="105" height="42" rx="21" fill="#1E293B" stroke="#10A37F" stroke-opacity="0.55"/>
        <circle cx="21" cy="21" r="5" fill="#10A37F"/>
        <text x="36" y="27">Codex</text>
      </g>
      <g transform="translate(723 391)">
        <rect width="112" height="42" rx="21" fill="#1E293B" stroke="#F8FAFC" stroke-opacity="0.45"/>
        <circle cx="21" cy="21" r="5" fill="#F8FAFC"/>
        <text x="36" y="27">Cursor</text>
      </g>
      <g transform="translate(849 391)">
        <rect width="98" height="42" rx="21" fill="#1E293B" stroke="#A78BFA" stroke-opacity="0.6"/>
